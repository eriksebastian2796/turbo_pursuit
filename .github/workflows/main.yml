name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

defaults:
  run:
    working-directory: turbo-pursuit-android

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias
        run: npm install
      - name: Crear el proyecto Android
        run: |
          npx cap add android
          node scripts/patch-android.js
          npx cap sync android
      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: turbo-pursuit-apk
          path: turbo-pursuit-android/android/app/build/outputs/apk/debug/app-debug.apk
