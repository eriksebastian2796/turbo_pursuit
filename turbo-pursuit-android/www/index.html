<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#090b12">
<title>Turbo Pursuit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=Chakra+Petch:ital,wght@0,600;0,700;1,700&display=swap" rel="stylesheet">
<style>
/* Concepto: cabina de arcade en horizontal. Una franja de sirena roja/azul marca el pulso; el resto queda quieto y legible. */
:root{
  --bg:#090b12; --panel:#121624; --panel2:#1b2136; --line:#2c3556;
  --ink:#eef1fb; --mute:#8d97ba;
  --red:#ff4552; --blue:#3d8bff; --gold:#ffc83d; --good:#3ddc97;
  --display:'Chakra Petch',system-ui,sans-serif;
  --num:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --body:'Barlow',system-ui,sans-serif;
  --g:clamp(92px,27vmin,160px); --b:clamp(68px,20vmin,118px); --s:clamp(66px,19vmin,108px); --j:clamp(120px,34vmin,190px);
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.35 var(--body);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
svg{display:block}
#stage{position:fixed;inset:0;background:#000;overflow:hidden}
#view{position:absolute;inset:0;width:100%;height:100%;display:block}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;z-index:20;background:radial-gradient(120% 90% at 18% 8%,#1d2446 0%,var(--bg) 62%);padding:max(14px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
.screen.veil{background:rgba(7,9,16,.82)}
.screen.center{align-items:center;justify-content:center}
.siren{position:absolute;left:0;right:0;top:0;height:6px;display:flex}
.siren i{flex:1;background:var(--red);animation:pulse .9s steps(1) infinite}
.siren i+i{background:var(--blue);animation-delay:.45s}
@keyframes pulse{50%{opacity:.15}}

.eyebrow{margin:0;font:600 13px/1 var(--num);letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}
h1,h2{margin:0;font-family:var(--display);font-style:italic;font-weight:700;text-transform:uppercase;text-wrap:balance}
h1{font-size:clamp(44px,15vmin,112px);line-height:.88;letter-spacing:-.01em}
h1 em{font-style:inherit;color:var(--red)}
h2{font-size:clamp(26px,7vmin,40px);line-height:1}
.lede{margin:0;max-width:34ch;color:#c4cbe6;font-size:clamp(14px,3.6vmin,17px)}
.row{display:flex;flex-wrap:wrap;gap:12px}
.coinline{display:inline-flex;align-items:center;gap:8px;font:700 22px/1 var(--num);color:var(--gold);letter-spacing:.02em}
.coinline span.t{color:var(--mute);font:600 14px/1 var(--num);letter-spacing:.12em;text-transform:uppercase}
.dot{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,var(--gold) 55%,#b9861a);box-shadow:0 0 0 2px rgba(255,200,61,.25)}

.btn{--c:var(--panel2);display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:48px;padding:0 26px;background:var(--c);font:700 17px/1 var(--display);letter-spacing:.07em;text-transform:uppercase;color:var(--ink);clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%);transition:transform .08s,filter .12s}
.btn:hover{filter:brightness(1.15)}
.btn:active{transform:scale(.97)}
.btn:focus-visible,.chip:focus-within,.tab:focus-visible,.pad:focus-visible{outline:2px solid #fff;outline-offset:-5px}
.btn.primary{--c:var(--red);color:#fff;min-height:54px;padding:0 34px;font-size:20px}
.btn.small{min-height:38px;padding:0 18px;font-size:14px}
.btn[disabled]{filter:grayscale(1) brightness(.6);cursor:default}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 14px;background:var(--panel);border:1px solid var(--line);border-radius:4px;font:600 14px/1 var(--num);letter-spacing:.1em;text-transform:uppercase;color:#c4cbe6}
.chip input{accent-color:var(--red);width:17px;height:17px;margin:0}

#menu .menu-main{flex:1;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:24px;align-items:center;min-height:0}
.menu-copy{display:flex;flex-direction:column;gap:clamp(8px,2.4vmin,18px);min-width:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.menu-car{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
.menu-car canvas,.g-prev canvas{width:100%;max-width:440px;height:auto;max-height:44vh}

.g-head{display:flex;align-items:center;gap:16px;justify-content:space-between;padding-top:6px}
.g-head h2{flex:1}
.g-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:20px;margin-top:10px}
.g-prev{display:flex;flex-direction:column;gap:10px;align-items:center;min-height:0;overflow:auto;touch-action:pan-y}
.stats{width:100%;display:grid;gap:5px}
.st{display:grid;grid-template-columns:112px 1fr 44px;align-items:center;gap:8px;font:600 13px/1 var(--num);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.st b{height:6px;background:var(--panel2);position:relative}
.st b i{position:absolute;inset:0 auto 0 0;background:var(--blue)}
.st span:last-child{color:var(--ink);text-align:right}
.g-panel{display:flex;flex-direction:column;min-height:0;background:var(--panel);border:1px solid var(--line)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;min-height:42px;font:700 15px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);border-bottom:3px solid transparent}
.tab.on{color:var(--ink);border-bottom-color:var(--red)}
.list{flex:1;min-height:0;overflow:auto;touch-action:pan-y;padding:8px;display:grid;gap:8px;align-content:start}
.card-r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 12px;background:var(--panel2);border-left:3px solid var(--line)}
.card-r.maxed{border-left-color:var(--good)}
.card-r h3{margin:0;font:700 16px/1.1 var(--display);letter-spacing:.04em;text-transform:uppercase}
.card-r p{margin:2px 0 0;color:var(--mute);font-size:13px}
.pips{display:flex;gap:3px;margin-top:6px}
.pips i{width:16px;height:5px;background:#323b5e}
.pips i.on{background:var(--blue)}
.card-r.maxed .pips i.on{background:var(--good)}
.sw{display:flex;flex-wrap:wrap;gap:8px;grid-column:1/-1}
.opt{min-height:40px;padding:0 12px;display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:4px;font:600 13px/1 var(--num);letter-spacing:.08em;text-transform:uppercase;color:#c4cbe6}
.opt.sel{border-color:var(--red);color:#fff;background:#2a1b27}
.opt .c{width:16px;height:16px;border-radius:50%;border:1px solid rgba(255,255,255,.35)}
.opt .p{color:var(--gold)}

#hud{position:absolute;inset:0;pointer-events:none;z-index:5;padding:max(8px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left));text-shadow:0 1px 6px rgba(0,0,0,.6)}
.hud-top{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:start}
.hl{display:grid;gap:4px;max-width:210px}
.hr{display:flex;gap:12px;justify-content:flex-end;align-items:center}
.hc{display:grid;gap:4px;justify-items:center;min-width:clamp(150px,34vw,300px)}
.lv{font:700 14px/1 var(--num);letter-spacing:.18em;text-transform:uppercase;color:#fff}
.cap{font:600 12px/1 var(--num);letter-spacing:.14em;text-transform:uppercase;color:#d5dbf3}
.time{font:700 clamp(34px,10vmin,58px)/.9 var(--num);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.time.low{color:var(--red)}
.bar{width:100%;height:9px;background:rgba(8,10,20,.7);border:1px solid rgba(255,255,255,.22);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0;width:100%;transform-origin:left;background:var(--good);transition:transform .15s}
.bar.tg i{background:var(--red)}
.bar.hp.low i{background:var(--red)}
.pausebtn{pointer-events:auto;width:42px;height:42px;display:grid;place-items:center;background:rgba(8,10,20,.6);border:1px solid rgba(255,255,255,.25);border-radius:50%;color:#fff}
.speedo{position:absolute;left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:baseline;gap:6px}
.speedo b{font:700 clamp(30px,9vmin,52px)/1 var(--num);font-variant-numeric:tabular-nums}
.speedo span{font:600 13px/1 var(--num);letter-spacing:.16em;text-transform:uppercase;color:#d5dbf3}
.banner{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font:700 clamp(34px,11vmin,84px)/1 var(--display);font-style:italic;text-transform:uppercase;text-align:center;white-space:nowrap;animation:pop .35s ease-out}
.banner small{display:block;margin-top:8px;font:600 clamp(13px,3.4vmin,18px)/1 var(--num);font-style:normal;letter-spacing:.2em;color:#e6e9f8}
@keyframes pop{from{transform:translate(-50%,-50%) scale(1.5);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}

#ctl{position:absolute;inset:0;z-index:6;pointer-events:none}
#joyZone{position:absolute;left:0;bottom:0;width:46%;height:74%;pointer-events:auto;touch-action:none}
#joy{position:absolute;left:calc(var(--j)*.35);bottom:max(18px,5vh);width:var(--j);height:var(--j);border-radius:50%;border:2px solid rgba(255,255,255,.3);background:rgba(10,14,30,.38);display:grid;place-items:center}
#joy::before,#joy::after{content:"";position:absolute;top:50%;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-left:0;border-bottom:0;transform:translateY(-50%) rotate(45deg)}
#joy::before{left:12px;transform:translateY(-50%) rotate(-135deg)}
#joy::after{right:12px}
#knob{width:42%;height:42%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#aab4d8 60%,#6b7599);box-shadow:0 4px 14px rgba(0,0,0,.5)}
.pad{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;display:grid;place-items:center;align-content:center;gap:2px;background:rgba(10,14,30,.5);border:3px solid rgba(255,255,255,.35);font:700 clamp(12px,3.2vmin,17px)/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:#fff}
.pad.on{filter:brightness(1.5);transform:scale(.95)}
#gas{width:var(--g);height:var(--g);right:max(14px,env(safe-area-inset-right));bottom:max(18px,5vh);border-color:var(--good);background:rgba(20,70,52,.55)}
#brake{width:var(--b);height:var(--b);right:calc(max(14px,env(safe-area-inset-right)) + var(--g) + 12px);bottom:max(18px,5vh);border-color:var(--red);background:rgba(90,22,30,.55)}
#special{width:var(--s);height:var(--s);right:calc(max(14px,env(safe-area-inset-right)) + var(--g)*.5 - var(--s)*.5);bottom:calc(max(18px,5vh) + var(--g) + 12px);border-color:var(--gold);background:rgba(80,62,10,.55)}
#special svg{width:46%;height:46%}
#special.empty{opacity:.45}
#special.ready{animation:glow 1s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 0 0 0 rgba(255,200,61,.0)}to{box-shadow:0 0 22px 6px rgba(255,200,61,.55)}}
#queue{position:absolute;display:flex;gap:6px;right:calc(max(14px,env(safe-area-inset-right)) + var(--g)*.5 + var(--s)*.5 + 10px);bottom:calc(max(18px,5vh) + var(--g) + 12px + var(--s)*.5 - 17px)}
.slot{width:34px;height:34px;display:grid;place-items:center;background:rgba(10,14,30,.6);border:2px solid rgba(255,255,255,.3);border-radius:6px}
.slot svg{width:20px;height:20px}
.slot.next{border-color:var(--gold)}
.fx{position:absolute;inset:0;pointer-events:none;z-index:4}
.card{width:min(560px,100%);background:var(--panel);border:1px solid var(--line);padding:clamp(14px,4vmin,26px);display:grid;gap:clamp(8px,2.4vmin,14px);position:relative}
.card .siren{height:5px}
.rl{display:grid;gap:4px}
.rl div{display:flex;justify-content:space-between;gap:12px;font:600 16px/1.2 var(--num);letter-spacing:.06em;text-transform:uppercase;color:#c4cbe6;border-bottom:1px solid var(--line);padding-bottom:4px}
.rl div b{color:var(--ink)}
.rl div.tot b{color:var(--gold)}
#rotate{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--bg);text-align:center;padding:24px}
#rotate svg{animation:turn 2.4s ease-in-out infinite}
@keyframes turn{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){#rotate{display:flex}}
@media (max-height:380px){.lede{display:none}.menu-car canvas{max-height:36vh}.st{grid-template-columns:100px 1fr 40px}}
@media (prefers-reduced-motion:reduce){.siren i,#special.ready,#rotate svg,.banner{animation:none}}
</style>
</head>
<body>


<div id="stage">
  <canvas id="view"></canvas>

  <div id="hud" hidden>
    <div class="hud-top">
      <div class="hl"><div class="lv" id="hLevel">Nivel 1</div><div class="bar hp" id="hHpBar"><i id="hHp"></i></div><div class="cap">Blindaje</div></div>
      <div class="hc"><div class="time" id="hTime">60</div><div class="bar tg"><i id="hTarget"></i></div><div class="cap" id="hGap">Objetivo</div></div>
      <div class="hr"><div class="coinline"><span class="dot"></span><b id="hCoins">0</b></div><button id="btnPause" class="pausebtn" aria-label="Pausa"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"/></svg></button></div>
    </div>
    <div class="speedo"><b id="hSpeed">0</b><span>km/h</span></div>
    <div id="banner" class="banner" hidden></div>
  </div>

  <div id="ctl" hidden>
    <div id="joyZone"><div id="joy"><div id="knob"></div></div></div>
    <div id="queue"></div>
    <button id="special" class="pad special empty" aria-label="Powerup"></button>
    <button id="brake" class="pad" aria-label="Freno">Freno</button>
    <button id="gas" class="pad" aria-label="Acelerador">Acel.</button>
  </div>

  <div id="menu" class="screen">
    <div class="siren" aria-hidden="true"><i></i><i></i></div>
    <div class="menu-main">
      <div class="menu-copy">
        <p class="eyebrow">Persecución a toda velocidad</p>
        <h1>Turbo<br><em>Pursuit</em></h1>
        <p class="lede">Alcanzá al fugitivo antes de que se acabe el tiempo. Embestilo, usá nitro y cohetes, y mejorá tu auto con lo que juntes.</p>
        <div class="row"><button class="btn primary" id="btnPlay">Jugar · nivel <span id="menuLevel">1</span></button><button class="btn" id="btnGarage">Garaje</button></div>
        <div class="opts">
          <label class="chip"><input type="checkbox" id="optSound"> Sonido</label>
          <label class="chip"><input type="checkbox" id="optAuto"> Acelerar solo</label>
          <button class="chip" id="btnFs" type="button">Pantalla completa</button>
        </div>
      </div>
      <div class="menu-car"><canvas id="carPrev" width="440" height="300"></canvas><div class="coinline"><span class="dot"></span><b id="menuCoins">0</b><span class="t">monedas</span></div></div>
    </div>
  </div>

  <div id="garage" class="screen" hidden>
    <div class="siren" aria-hidden="true"><i></i><i></i></div>
    <div class="g-head"><button class="btn small" id="btnBack">‹ Volver</button><h2>Garaje</h2><div class="coinline"><span class="dot"></span><b id="gCoins">0</b></div></div>
    <div class="g-body">
      <aside class="g-prev"><canvas id="gPrev" width="400" height="280"></canvas><div id="gStats" class="stats"></div></aside>
      <section class="g-panel"><div class="tabs"><button class="tab on" data-tab="up">Mejoras</button><button class="tab" data-tab="style">Estilo</button></div><div id="gList" class="list"></div></section>
    </div>
  </div>

  <div id="pause" class="screen veil center" hidden>
    <div class="card"><div class="siren" aria-hidden="true"><i></i><i></i></div><h2>Pausa</h2>
      <div class="row"><button class="btn primary" id="pResume">Seguir</button><button class="btn" id="pQuit">Salir al menú</button></div></div>
  </div>

  <div id="result" class="screen veil center" hidden>
    <div class="card"><div class="siren" aria-hidden="true"><i></i><i></i></div>
      <p class="eyebrow" id="rKicker"></p><h2 id="rTitle"></h2><div id="rLines" class="rl"></div>
      <div class="row"><button class="btn primary" id="rNext">Siguiente nivel</button><button class="btn" id="rGarage">Garaje</button><button class="btn" id="rRetry">Reintentar</button></div></div>
  </div>
</div>

<div id="rotate"><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18.5h2"/></svg><h2>Girá el teléfono</h2><p class="lede">Turbo Pursuit se juega en horizontal.</p></div>

<script>
'use strict';
/* ===== Utilidades ===== */
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const rndi = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const easeIO = (a, b, p) => a + (b - a) * ((-Math.cos(p * Math.PI) / 2) + 0.5);
const easeIn = (a, b, p) => a + (b - a) * p * p;
const sgn = v => (v < 0 ? -1 : 1);

/* ===== Guardado ===== */
const SAVE_KEY = 'turbo-pursuit-v1';
const defaultSave = () => ({
  coins: 0, level: 1,
  up: {},
  own: { paint: [0], spoiler: [0], neon: [0], stripe: [0] },
  eq: { paint: 0, spoiler: 0, neon: 0, stripe: 0 },
  opt: { sound: true, auto: false }
});
let save = defaultSave();
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return;
    const s = JSON.parse(raw), d = defaultSave();
    save = { coins: +s.coins || 0, level: Math.max(1, +s.level || 1), up: s.up || {},
      own: Object.assign(d.own, s.own || {}), eq: Object.assign(d.eq, s.eq || {}), opt: Object.assign(d.opt, s.opt || {}) };
  } catch (e) { /* sin guardado */ }
}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* ignorar */ } }

/* ===== Mejoras y estilo ===== */
const UPGRADES = [
  { id: 'engine', name: 'Motor', desc: 'Más velocidad máxima', max: 6, base: 300 },
  { id: 'turbo', name: 'Turbo', desc: 'Acelera más rápido', max: 5, base: 260 },
  { id: 'brakes', name: 'Frenos', desc: 'Frenás más corto y girás mejor', max: 5, base: 240 },
  { id: 'tires', name: 'Neumáticos', desc: 'Más agarre y menos derrape en aceite', max: 5, base: 280 },
  { id: 'armor', name: 'Blindaje', desc: 'Más resistencia a los choques', max: 6, base: 320 },
  { id: 'susp', name: 'Suspensión', desc: 'Baches y banquina te frenan menos', max: 4, base: 260 },
  { id: 'nitro', name: 'Nitro+', desc: 'El nitro dura más', max: 5, base: 300 },
  { id: 'rocket', name: 'Cohetes+', desc: 'Los cohetes hacen más daño', max: 4, base: 340 },
  { id: 'magnet', name: 'Imán+', desc: 'El imán dura más y atrae de más lejos', max: 4, base: 300 },
  { id: 'slots', name: 'Compartimento', desc: 'Llevás más powerups guardados', max: 2, base: 700 }
];
const upLv = id => save.up[id] || 0;
const upCost = u => Math.round(u.base * Math.pow(1.55, upLv(u.id)));

const COSMETICS = {
  paint: { name: 'Pintura', items: [
    { n: 'Rojo sirena', c: '#e8283a', p: 0 }, { n: 'Azul cobalto', c: '#2f6bff', p: 250 },
    { n: 'Blanco perla', c: '#e9edf5', p: 250 }, { n: 'Amarillo taxi', c: '#ffc400', p: 300 },
    { n: 'Verde ácido', c: '#46d36b', p: 350 }, { n: 'Violeta', c: '#8e4dff', p: 400 },
    { n: 'Naranja fuego', c: '#ff7a1a', p: 350 }, { n: 'Negro mate', c: '#232733', p: 500 }] },
  spoiler: { name: 'Alerón', items: [{ n: 'Sin alerón', p: 0 }, { n: 'Bajo', p: 300 }, { n: 'Competición', p: 600 }] },
  neon: { name: 'Neón', items: [

  if (!ctx || !G.stats) return;
  frameNo++;
  const N = segments.length;
  ctx.save();
  if (G.shake > 0) ctx.translate(rnd(-1, 1) * G.shake * 9, rnd(-1, 1) * G.shake * 9);
  drawBackground(dt);
  const base = findSeg(P.pos), basePct = (P.pos % SEG) / SEG, camY = P.y + CAMH;
  let maxy = H, x = 0, dx = -(base.curve * basePct);
  for (let n = 0; n < DRAW; n++) {
    const seg = segments[(base.index + n) % N];
    seg.looped = seg.index < base.index;
    const cz = P.pos - (seg.looped ? trackLength : 0);
    project(seg.p1, P.x * ROADW - x, camY, cz);
    project(seg.p2, P.x * ROADW - x - dx, camY, cz);
    x += dx; dx += seg.curve;
    seg.clip = maxy;
    if (seg.p1.camera.z <= CAMD || seg.p2.screen.y >= seg.p1.screen.y || seg.p2.screen.y >= maxy) continue;
    drawSegment(seg, n);
    maxy = seg.p1.screen.y;
  }
  for (let n = DRAW - 1; n > 0; n--) {
    const seg = segments[(base.index + n) % N];
    if (seg.p1.camera.z <= CAMD) continue;
    const s1 = seg.p1.screen, s2 = seg.p2.screen, clip = seg.clip, fa = 1 - fogAt(n) * 0.8;
    ctx.globalAlpha = fa;
    for (const c of seg.cars) {
      const sc = lerp(s1.scale, s2.scale, c.pct), u = sc * ROADW * W / 2;
      const sx = lerp(s1.x, s2.x, c.pct) + u * c.off, sy = lerp(s1.y, s2.y, c.pct);
      if (c.isTarget) ctx.globalAlpha = 1;
      if (sy > clip) { ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, clip); ctx.clip(); drawTrafficCar(c, sx, sy, u, n); ctx.restore(); }
      else drawTrafficCar(c, sx, sy, u, n);
      ctx.globalAlpha = fa;
    }
    const u1 = s1.w;
    if (u1 > 1.5) {
      for (const s of seg.sprites) {
        if (s.dead) continue;
        const sx = s1.x + u1 * s.off, sy = s1.y;
        if (sx < -u1 * 3 || sx > W + u1 * 3) continue;
        if (sy > clip) { ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, clip); ctx.clip(); drawSprite(s, sx, sy, u1, n); ctx.restore(); }
        else drawSprite(s, sx, sy, u1, n);
      }
    }
    ctx.globalAlpha = 1;
    for (const r of G.rockets) if (findSeg(r.z) === seg) { const pc = (r.z % SEG) / SEG, sc = lerp(s1.scale, s2.scale, pc), u = sc * ROADW * W / 2; drawRocket(lerp(s1.x, s2.x, pc) + u * r.off, lerp(s1.y, s2.y, pc), u); }
    for (const f of G.fx) if (findSeg(f.z) === seg) { const pc = (f.z % SEG) / SEG, sc = lerp(s1.scale, s2.scale, pc), u = sc * ROADW * W / 2; drawFx(f, lerp(s1.x, s2.x, pc) + u * f.off, lerp(s1.y, s2.y, pc), u); }
  }
  ctx.globalAlpha = 1;
  const ps = findSeg(P.pos + PLAYERZ), pp = (wrapZ(P.pos + PLAYERZ) % SEG) / SEG, pscale = CAMD / PLAYERZ;
  CAR.x = W / 2; CAR.w = PW * pscale * ROADW * W / 2;
  CAR.y = HZY - pscale * lerp(ps.p1.camera.y || -camY, ps.p2.camera.y || -camY, pp) * H / 2 - P.bounce * 10 + (G.countdown > 0 ? 0 : rnd(-0.5, 0.5) * clamp(P.speed / 9000, 0, 1.2) * (P.offroad ? 4 : 1.2));
  drawPlayer();
  for (const p of G.parts) { ctx.globalAlpha = clamp(p.life / p.max, 0, 1); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(0.5, p.r), 0, 6.2832); ctx.fill(); }
  ctx.globalAlpha = 1;
  ctx.restore();
  drawOverlays(dt);
}
function drawOverlays(dt) {
  const th = G.theme;
  if (th.snow) {
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    for (const f of flakes) { f[1] += f[2] * dt; f[0] += Math.sin(G.t + f[3]) * 14 * dt - P.speed * 0.0012 * 0; if (f[1] > H) { f[1] = -4; f[0] = rnd(0, W); } ctx.fillRect(f[0], f[1], 2, 2); }
  }
  if (P.nitro > 0) {
    ctx.strokeStyle = 'rgba(160,235,255,.35)'; ctx.lineWidth = 2; ctx.beginPath();
    for (let i = 0; i < 18; i++) { const a = i / 18 * 6.2832 + Math.floor(G.t * 20) * 0.37, r0 = H * (0.38 + (i % 3) * 0.08), r1 = r0 + H * 0.5; ctx.moveTo(W / 2 + Math.cos(a) * r0 * 1.6, HZY + Math.sin(a) * r0); ctx.lineTo(W / 2 + Math.cos(a) * r1 * 1.6, HZY + Math.sin(a) * r1); }
    ctx.stroke();
  }
  const low = P.hp < P.maxHp * 0.3 ? (0.15 + 0.1 * Math.sin(G.t * 8)) : 0, fl = Math.max(G.flash * 0.5, low);
  if (fl > 0.01) {
    const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.95);
    g.addColorStop(0, 'rgba(255,40,40,0)'); g.addColorStop(1, 'rgba(255,40,40,' + fl + ')'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  if (G.state === 'run') {
    const ph = Math.sin(G.t * 9) > 0, sg = ctx.createLinearGradient(0, 0, W * 0.2, 0);
    sg.addColorStop(0, ph ? 'rgba(255,69,82,.2)' : 'rgba(61,139,255,.2)'); sg.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = sg; ctx.fillRect(0, 0, W * 0.2, H);
    const sg2 = ctx.createLinearGradient(W, 0, W * 0.8, 0);
    sg2.addColorStop(0, ph ? 'rgba(61,139,255,.2)' : 'rgba(255,69,82,.2)'); sg2.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = sg2; ctx.fillRect(W * 0.8, 0, W * 0.2, H);
  }
  ctx.textAlign = 'center'; ctx.font = "italic 700 " + Math.round(H * 0.06) + "px 'Chakra Petch',system-ui,sans-serif"; ctx.lineJoin = 'round';
  for (let i = 0; i < G.pops.length; i++) {
    const p = G.pops[i];
    ctx.globalAlpha = clamp(1 - Math.max(0, p.t - 0.9) / 0.4, 0, 1);
    const y = H * 0.66 - i * H * 0.07 - Math.min(p.t, 0.3) * 30;
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(8,10,20,.85)'; ctx.strokeText(p.text, W / 2, y); ctx.fillStyle = p.color; ctx.fillText(p.text, W / 2, y);
  }
  ctx.globalAlpha = 1;
}

/* ----- Vista previa del garaje ----- */
function drawPreview(cnv, t) {
  const c = cnv.getContext('2d'); if (!c) return;
  const old = ctx; ctx = c;
  const w = cnv.width, h = cnv.height;
  c.clearRect(0, 0, w, h);
  const rg = c.createRadialGradient(w / 2, h * 0.75, 4, w / 2, h * 0.75, w * 0.5); rg.addColorStop(0, 'rgba(70,90,170,.45)'); rg.addColorStop(1, 'rgba(70,90,170,0)'); c.fillStyle = rg; c.fillRect(0, 0, w, h);
  const g = c.createLinearGradient(0, h * 0.55, 0, h); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(255,255,255,.06)'); c.fillStyle = g; c.fillRect(0, h * 0.55, w, h * 0.45);
  const o = look(); o.brake = true; o.siren = true; o.sirenT = t || 0;
  drawCar(w / 2, h * 0.9 + Math.sin((t || 0) * 2) * 1.5, w * 0.62, o);
  ctx = old;
}
/* ===== Interfaz, controles y bucle ===== */
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
let bannerTimer = 0, garageTab = 'up';
const hc = {};
function setText(id, v) { if (hc[id] !== v) { hc[id] = v; $(id).textContent = v; } }
function setCls(id, c, on) { const k = id + c; if (hc[k] !== on) { hc[k] = on; $(id).classList.toggle(c, on); } }

function showScreen(name) {
  for (const id of ['menu', 'garage', 'pause', 'result']) $(id).hidden = id !== name;
  const run = name === 'run' || name === 'pause';
  $('hud').hidden = !run; $('ctl').hidden = !run;
  if (name !== 'run') { input.joy = 0; input.tGas = false; input.tBrake = false; }
}
function showBanner(text, sub, ms, color) {
  const b = $('banner'); b.hidden = false; b.style.color = color || '#fff'; b.textContent = text;
  if (sub) { const s = el('small'); s.textContent = sub; b.appendChild(s); }
  b.style.animation = 'none'; void b.offsetWidth; b.style.animation = '';
  clearTimeout(bannerTimer); bannerTimer = setTimeout(() => { b.hidden = true; }, ms || 1000);
}
function onLevelStart() {
  $('hLevel').textContent = 'Nivel ' + G.level;
  showBanner('Nivel ' + G.level, G.theme.name, 1150, '#fff');
  Object.keys(hc).forEach(k => delete hc[k]);
  refreshQueue(); updateHud();
}
function refreshQueue() {
  const q = $('queue'); q.innerHTML = '';
  for (let i = 0; i < G.stats.slots; i++) {
    const d = el('div', 'slot' + (i === 0 && P.queue[0] ? ' next' : ''));
    if (P.queue[i]) d.innerHTML = iconSVG(P.queue[i], 20);
    q.appendChild(d);
  }
  const sp = $('special'), t = P.queue[0];
  sp.classList.toggle('ready', !!t); sp.classList.toggle('empty', !t);
  sp.innerHTML = t ? iconSVG(t, 40) + '<span style="font-size:clamp(9px,2.4vmin,12px)">' + PU[t].name + '</span>' : '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="#ffc83d" stroke-width="2" opacity=".6"/></svg>';
}
function updateHud() {
  if (!G.stats || !T) return;
  setText('hTime', String(Math.ceil(G.time))); setCls('hTime', 'low', G.time < 10);
  setText('hSpeed', String(Math.round(P.speed / 12000 * 320)));
  setText('hCoins', String(G.runCoins));
  const hp = clamp(P.hp / P.maxHp, 0, 1);
  $('hHp').style.transform = 'scaleX(' + hp.toFixed(3) + ')'; setCls('hHpBar', 'low', hp < 0.3);
  $('hTarget').style.transform = 'scaleX(' + clamp(T.hp / T.maxHp, 0, 1).toFixed(3) + ')';
  const d = G.dist || 0;
  setText('hGap', d < -300 ? 'Objetivo detrás de vos' : (d < 1500 ? '¡Embestilo!' : 'Objetivo a ' + Math.round(d / 60) + ' m'));
}
function renderResult(win, lines, total) {
  $('banner').hidden = true;
  showScreen('result');
  $('rKicker').textContent = 'Nivel ' + G.level + ' · ' + G.theme.name;
  $('rTitle').textContent = win ? '¡Fugitivo capturado!' : (G.result.reason === 'time' ? 'Se escapó' : 'Fuera de combate');
  const box = $('rLines'); box.innerHTML = '';
  for (const l of lines) { const d = el('div', '', '<span></span><b></b>'); d.firstChild.textContent = l[0]; d.lastChild.textContent = l[1]; box.appendChild(d); }
  const t = el('div', 'tot', '<span>Total ganado</span><b></b>'); t.lastChild.textContent = '+' + total; box.appendChild(t);
  $('rNext').hidden = !win;
  $('rRetry').hidden = false;
}

/* ----- Flujo ----- */
function startRun(level) {
  audioInit(); audioMute();
  showScreen('run');
  startLevel(level);
}
function setPaused(on) {
  if (G.state !== 'run') return;
  G.paused = on; $('pause').hidden = !on;
  musicState.on = !on;
  if (on) { engineSound(false, 0); input.joy = 0; input.tGas = false; input.tBrake = false; }
}
function openMenu() {
  G.state = 'menu'; musicState.on = false; engineSound(false, 0);
  showScreen('menu');
  $('menuLevel').textContent = save.level; $('menuCoins').textContent = save.coins;
  $('optSound').checked = !!save.opt.sound; $('optAuto').checked = !!save.opt.auto;
}
function openGarage() {
  G.state = 'garage'; musicState.on = false; engineSound(false, 0);
  showScreen('garage'); renderGarage();
}

/* ----- Garaje ----- */
function statBar(label, v, text) {
  const d = el('div', 'st', '<span></span><b><i></i></b><span></span>');
  d.children[0].textContent = label; d.children[1].firstChild.style.width = Math.round(clamp(v, 0, 1) * 100) + '%'; d.children[2].textContent = text;
  return d;
}
function renderGarage() {
  $('gCoins').textContent = save.coins;
  const st = carStats(), list = $('gList'), keep = list.scrollTop;
  list.innerHTML = '';
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === garageTab));
  if (garageTab === 'up') {
    for (const u of UPGRADES) {
      const lv = upLv(u.id), maxed = lv >= u.max, cost = upCost(u);
      const row = el('div', 'card-r' + (maxed ? ' maxed' : ''));
      const info = el('div', '', '<h3></h3><p></p><div class="pips"></div>');
      info.children[0].textContent = u.name; info.children[1].textContent = u.desc;
      for (let i = 0; i < u.max; i++) info.children[2].appendChild(el('i', i < lv ? 'on' : ''));
      const b = el('button', 'btn small', maxed ? 'Máx.' : '<span class="dot"></span> ' + cost);
      b.disabled = maxed || save.coins < cost;
      b.addEventListener('click', () => { if (save.coins >= cost && upLv(u.id) < u.max) { save.coins -= cost; save.up[u.id] = upLv(u.id) + 1; persist(); SFX.pickup(); renderGarage(); } });
      row.appendChild(info); row.appendChild(b); list.appendChild(row);
    }
  } else {
    for (const key of Object.keys(COSMETICS)) {
      const cat = COSMETICS[key], row = el('div', 'card-r', '<div><h3></h3></div>');
      row.firstChild.firstChild.textContent = cat.name;
      const sw = el('div', 'sw');
      cat.items.forEach((it, i) => {
        const owned = save.own[key].indexOf(i) >= 0;
        const o = el('button', 'opt' + (save.eq[key] === i ? ' sel' : ''), (it.c ? '<span class="c" style="background:' + it.c + '"></span>' : '') + '<span></span>' + (owned ? '' : '<span class="p">' + it.p + '</span>'));
        o.children[it.c ? 1 : 0].textContent = it.n;
        o.addEventListener('click', () => {
          if (!owned) { if (save.coins < it.p) return; save.coins -= it.p; save.own[key].push(i); SFX.pickup(); }
          save.eq[key] = i; persist(); renderGarage();
        });
        sw.appendChild(o);
      });
      row.appendChild(sw); list.appendChild(row);
    }
  }
  list.scrollTop = keep;
  const sb = $('gStats'); sb.innerHTML = '';
  sb.appendChild(statBar('Velocidad', st.maxSpeed / 13800, Math.round(st.maxSpeed / 12000 * 320)));
  sb.appendChild(statBar('Aceleración', st.accel / 5500, Math.round(st.accel / 55)));
  sb.appendChild(statBar('Manejo', (st.steer - 2) / 1, (st.steer).toFixed(1)));
  sb.appendChild(statBar('Blindaje', st.maxHp / 220, st.maxHp));
  sb.appendChild(statBar('Nitro', st.nitroTime / 8.5, st.nitroTime.toFixed(1) + ' s'));
  drawPreview($('gPrev'), 0);
}

/* ----- Controles ----- */
function hold(e, on, off) {
  const ids = new Set();
  e.addEventListener('pointerdown', ev => { ev.preventDefault(); try { e.setPointerCapture(ev.pointerId); } catch (x) { /* ignorar */ } ids.add(ev.pointerId); e.classList.add('on'); on(); });
  const up = ev => { if (!ids.delete(ev.pointerId)) return; if (!ids.size) { e.classList.remove('on'); off(); } };
  e.addEventListener('pointerup', up); e.addEventListener('pointercancel', up); e.addEventListener('lostpointercapture', up);
}
function setupControls() {
  const zone = $('joyZone'), joy = $('joy'), knob = $('knob');
  let pid = null, cx = 0, cy = 0, R = 60;
  const move = ev => {
    const dx = ev.clientX - cx, dy = ev.clientY - cy, d = Math.hypot(dx, dy), k = d > R ? R / d : 1;
    knob.style.transform = 'translate(' + (dx * k) + 'px,' + (dy * k) + 'px)';
    let v = clamp(dx / (R * 0.85), -1, 1); if (Math.abs(v) < 0.1) v = 0; input.joy = v;
  };
  const end = ev => { if (ev.pointerId !== pid) return; pid = null; input.joy = 0; knob.style.transform = ''; joy.style.left = ''; joy.style.bottom = ''; };
  zone.addEventListener('pointerdown', ev => {
    if (pid !== null) return; pid = ev.pointerId; try { zone.setPointerCapture(ev.pointerId); } catch (x) { /* ignorar */ }
    const zr = zone.getBoundingClientRect(), jr = joy.getBoundingClientRect(); R = jr.width / 2 || 60;
    cx = clamp(ev.clientX, zr.left + R, zr.right - R); cy = clamp(ev.clientY, zr.top + R, zr.bottom - R);
    joy.style.left = (cx - zr.left - R) + 'px'; joy.style.bottom = (zr.bottom - cy - R) + 'px';
    move(ev); ev.preventDefault();
  });
  zone.addEventListener('pointermove', ev => { if (ev.pointerId === pid) move(ev); });
  zone.addEventListener('pointerup', end); zone.addEventListener('pointercancel', end); zone.addEventListener('lostpointercapture', end);
  hold($('gas'), () => { input.tGas = true; }, () => { input.tGas = false; });
  hold($('brake'), () => { input.tBrake = true; }, () => { input.tBrake = false; });
  hold($('special'), () => { useSpecial(); }, () => {});
  document.addEventListener('contextmenu', e => e.preventDefault());
  const key = (e, d) => {
    const k = e.code;
    if (k === 'ArrowLeft' || k === 'KeyA') input.left = d;
    else if (k === 'ArrowRight' || k === 'KeyD') input.right = d;
    else if (k === 'ArrowUp' || k === 'KeyW') input.kGas = d;
    else if (k === 'ArrowDown' || k === 'KeyS') input.kBrake = d;
    else if ((k === 'Space' || k === 'ShiftLeft' || k === 'KeyE') && d) useSpecial();
    else if ((k === 'Escape' || k === 'KeyP') && d && G.state === 'run') setPaused(!G.paused);
    else return;
    e.preventDefault();
  };
  window.addEventListener('keydown', e => key(e, true)); window.addEventListener('keyup', e => key(e, false));
  document.addEventListener('visibilitychange', () => { if (document.hidden && G.state === 'run' && !G.paused) setPaused(true); });
}
function setupUI() {
  $('btnPlay').addEventListener('click', () => startRun(save.level));
  $('btnGarage').addEventListener('click', () => { audioInit(); openGarage(); });
  $('btnBack').addEventListener('click', openMenu);
  $('btnPause').addEventListener('click', () => setPaused(true));
  $('pResume').addEventListener('click', () => setPaused(false));
  $('pQuit').addEventListener('click', () => { G.paused = false; openMenu(); });
  $('rNext').addEventListener('click', () => startRun(save.level));
  $('rRetry').addEventListener('click', () => startRun(G.level));
  $('rGarage').addEventListener('click', openGarage);
  $('optSound').addEventListener('change', e => { save.opt.sound = e.target.checked; persist(); audioInit(); audioMute(); });
  $('optAuto').addEventListener('change', e => { save.opt.auto = e.target.checked; persist(); });
  $('btnFs').addEventListener('click', () => {
    const d = document.documentElement;
    try { const p = (d.requestFullscreen || d.webkitRequestFullscreen).call(d); Promise.resolve(p).then(() => { try { screen.orientation.lock('landscape').catch(() => {}); } catch (x) { /* ignorar */ } }).catch(() => {}); } catch (x) { /* ignorar */ }
  });
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => { garageTab = t.dataset.tab; renderGarage(); }));
}

/* ----- Bucle ----- */
let lastT = 0, accT = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.1, (now - lastT) / 1000 || 0); lastT = now;
  if (G.state === 'run' && !G.paused) {
    accT += dt; let n = 0;
    while (accT >= 1 / 60 && n < 6) { update(1 / 60); accT -= 1 / 60; n++; }
    if (accT > 1 / 60) accT = 0;
    if (G.state === 'run') { updateHud(); render(dt); }
  } else {
    if (G.state !== 'run') engineSound(false, 0);
    if (!$('menu').hidden) drawPreview($('carPrev'), now / 1000);
  }
}
function boot() {
  loadSave();
  cv = $('view'); ctx = cv.getContext('2d');
  resize(); window.addEventListener('resize', resize);
  setupControls(); setupUI(); openMenu();
  requestAnimationFrame(loop);
}
boot();
</script>
